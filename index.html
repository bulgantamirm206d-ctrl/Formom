<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Amazing Mom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background: #fffaf0; }
        .flower { position: absolute; font-size: 24px; animation: fall 5s linear infinite; opacity: 0.6; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    <div id="flower-container"></div>
    
    <div class="z-10 bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-xl text-center border-2 border-orange-100 max-w-sm">
        <div class="text-5xl mb-4">🌸</div>
        <h1 class="text-3xl font-bold text-orange-600 mb-2">To My Best Mom</h1>
        <p class="text-gray-600 italic mb-6">"Everything I am, I owe to you."</p>
        
        <div class="text-left space-y-4 mb-8">
            <div class="flex items-center gap-3">
                <span class="text-orange-400">✨</span>
                <p class="text-gray-700">Thank you for always supporting me.</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-orange-400">✨</span>
                <p class="text-gray-700">Thank you for your endless love.</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-orange-400">✨</span>
                <p class="text-gray-700">Thank you for being my hero.</p>
            </div>
        </div>

        <p class="text-xl font-bold text-orange-500 font-serif">I Love You! ❤️</p>
    </div>

    <script>
        function createFlower() {
            const flowers = ['🌸', '🌼', '✨', '🌻'];
            const flower = document.createElement('div');
            flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
            flower.className = 'flower';
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('flower-container').appendChild(flower);
            setTimeout(() => { flower.remove(); }, 6000);
        }
        setInterval(createFlower, 500);
    </script>
</body>
</html>
